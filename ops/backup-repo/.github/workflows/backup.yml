name: Encrypted D1 backup

on:
  schedule:
    - cron: "17 18 * * *" # 02:17 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private backup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: backup-store
          fetch-depth: 0

      - name: Check out pinned life-log source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ vars.LIFE_LOG_SOURCE_REPOSITORY }}
          ref: ${{ vars.LIFE_LOG_SOURCE_REF }}
          path: source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Validate configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          SOURCE_REPOSITORY: ${{ vars.LIFE_LOG_SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ vars.LIFE_LOG_SOURCE_REF }}
          BACKUP_BRANCH: ${{ vars.BACKUP_BRANCH || 'backups' }}
          BACKUP_KEEP_DAILY: ${{ vars.BACKUP_KEEP_DAILY || '7' }}
          BACKUP_KEEP_WEEKLY: ${{ vars.BACKUP_KEEP_WEEKLY || '4' }}
          BACKUP_KEEP_MONTHLY: ${{ vars.BACKUP_KEEP_MONTHLY || '6' }}
        run: |
          set -euo pipefail
          check_secret() {
            name="$1"
            value="$2"
            if test -z "$value"; then
              echo "::error title=Missing secret::$name is empty or unavailable."
              exit 1
            fi
            trimmed="$(printf '%s' "$value" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if test "$value" != "$trimmed"; then
              echo "::error title=Invalid secret::$name contains leading or trailing whitespace. Update the GitHub Actions secret with the exact raw value."
              exit 1
            fi
          }
          check_secret CLOUDFLARE_API_TOKEN "$CF_API_TOKEN"
          check_secret CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT_ID"
          check_secret D1_DATABASE_ID "$D1_DATABASE_ID"
          check_secret BACKUP_AGE_RECIPIENT "$AGE_RECIPIENT"
          case "$CF_ACCOUNT_ID" in
            *[!0-9a-fA-F]*|'') echo "::error title=Invalid account ID::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters."; exit 1 ;;
          esac
          test "${#CF_ACCOUNT_ID}" -eq 32 || { echo "::error title=Invalid account ID::CLOUDFLARE_ACCOUNT_ID must be exactly 32 hexadecimal characters."; exit 1; }
          printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$' || {
            echo "::error title=Invalid database ID::D1_DATABASE_ID must be a UUID without surrounding whitespace."
            exit 1
          }
          test -n "$D1_DATABASE_NAME"
          test -n "$SOURCE_REPOSITORY"
          test -n "$SOURCE_REF"
          case "$AGE_RECIPIENT" in age1*) ;; *) exit 1 ;; esac
          git check-ref-format --branch "$BACKUP_BRANCH"
          for value in "$BACKUP_KEEP_DAILY" "$BACKUP_KEEP_WEEKLY" "$BACKUP_KEEP_MONTHLY"; do
            case "$value" in ''|*[!0-9]*) exit 1 ;; esac
            test "$value" -gt 0
          done

      - name: Install source dependencies
        working-directory: source
        run: npm ci

      - name: Preflight D1 read access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          PREFLIGHT_RESPONSE="$RUNNER_TEMP/d1-preflight.json"
          if ! HTTP_STATUS="$(curl --silent --show-error \
            --output "$PREFLIGHT_RESPONSE" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$D1_DATABASE_ID")"; then
            echo "::error title=D1 preflight transport failure::Could not reach the Cloudflare API. No export was attempted."
            exit 1
          fi
          if test "$HTTP_STATUS" != "200"; then
            echo "::error title=D1 read preflight failed::Cloudflare rejected the read-only database check with HTTP $HTTP_STATUS. No export was attempted."
            python3 - "$PREFLIGHT_RESPONSE" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print("Cloudflare response was not valid JSON.", file=sys.stderr)
              raise SystemExit(0)
          for error in (payload.get("errors") or [])[:3]:
              code = str(error.get("code", "unknown"))
              message = " ".join(str(error.get("message", "unspecified error")).split())[:300]
              print(f"Cloudflare error code={code}: {message}", file=sys.stderr)
          PY
            exit 1
          fi
          python3 - "$PREFLIGHT_RESPONSE" "$D1_DATABASE_ID" "$D1_DATABASE_NAME" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          result = payload.get("result") or {}
          if payload.get("success") is not True:
              raise SystemExit("D1 preflight returned HTTP 200 without success=true.")
          if result.get("uuid") != sys.argv[2] or result.get("name") != sys.argv[3]:
              raise SystemExit("D1 preflight returned a database that does not match the configured name and ID.")
          print(f"D1 read preflight passed for database {result['name']}.")
          PY

      - name: Export remote D1 into temporary staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/new-backup"
          chmod 700 "$RUNNER_TEMP/new-backup"
          cat > "$RUNNER_TEMP/wrangler-backup.toml" <<EOF
          name = "life-log-backup"
          account_id = "$CLOUDFLARE_ACCOUNT_ID"
          compatibility_date = "2026-09-20"
          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF
          cd source
          if ! npx wrangler d1 export "$D1_DATABASE_NAME" --remote --output "$RUNNER_TEMP/new-backup/export.sql" --config "$RUNNER_TEMP/wrangler-backup.toml"; then
            echo "::error title=D1 export failed::The read-only preflight passed, but Wrangler could not export D1. The configured account_id was explicit and no snapshot branch was modified."
            exit 1
          fi
          test -s "$RUNNER_TEMP/new-backup/export.sql" || {
            echo "::error title=Empty D1 export::Wrangler completed without producing a non-empty SQL file. No snapshot branch was modified."
            exit 1
          }

      - name: Verify, encrypt, and checksum new backup
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          MINT_AGE_DIR: ${{ runner.temp }}/age
        run: |
          DATE="$(TZ=Asia/Shanghai date +%F)"
          python3 source/scripts/verify-sql-backup.py --sql "$RUNNER_TEMP/new-backup/export.sql" --backup-dir "$RUNNER_TEMP/verification"
          AGE_JSON="$(node source/scripts/backup/install-age.mjs)"
          AGE_BIN="$(node -e 'console.log(JSON.parse(process.argv[1]).binary)' "$AGE_JSON")"
          "$AGE_BIN" -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/new-backup/backup-$DATE.sql.age" "$RUNNER_TEMP/new-backup/export.sql"
          "$AGE_BIN" -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/new-backup/manifest-$DATE.json.age" "$RUNNER_TEMP/verification/restore-verification.json"
          cd "$RUNNER_TEMP/new-backup"
          sha256sum "backup-$DATE.sql.age" "manifest-$DATE.json.age" > "backup-$DATE.sha256"
          sha256sum --check "backup-$DATE.sha256"
          rm -f export.sql

      - name: Build retained snapshot after validation
        env:
          BACKUP_BRANCH: ${{ vars.BACKUP_BRANCH || 'backups' }}
          BACKUP_KEEP_DAILY: ${{ vars.BACKUP_KEEP_DAILY || '7' }}
          BACKUP_KEEP_WEEKLY: ${{ vars.BACKUP_KEEP_WEEKLY || '4' }}
          BACKUP_KEEP_MONTHLY: ${{ vars.BACKUP_KEEP_MONTHLY || '6' }}
        run: |
          git -C backup-store fetch origin "refs/heads/$BACKUP_BRANCH:refs/remotes/origin/$BACKUP_BRANCH" || true
          EXPECTED_SHA="$(git -C backup-store rev-parse "refs/remotes/origin/$BACKUP_BRANCH" 2>/dev/null || true)"
          mkdir -p "$RUNNER_TEMP/snapshot"
          if test -n "$EXPECTED_SHA"; then
            git -C backup-store archive "$EXPECTED_SHA" | tar -x -C "$RUNNER_TEMP/snapshot"
          fi
          cp "$RUNNER_TEMP/new-backup"/* "$RUNNER_TEMP/snapshot/"
          node source/scripts/backup/retention.mjs --dir="$RUNNER_TEMP/snapshot" --daily="$BACKUP_KEEP_DAILY" --weekly="$BACKUP_KEEP_WEEKLY" --monthly="$BACKUP_KEEP_MONTHLY"
          printf '%s' "$EXPECTED_SHA" > "$RUNNER_TEMP/expected-sha"

      - name: Publish snapshot with lease protection
        env:
          BACKUP_BRANCH: ${{ vars.BACKUP_BRANCH || 'backups' }}
        run: |
          EXPECTED_SHA="$(cat "$RUNNER_TEMP/expected-sha")"
          export GIT_INDEX_FILE="$RUNNER_TEMP/backup-index"
          git -C backup-store config user.name "github-actions[bot]"
          git -C backup-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C backup-store read-tree --empty
          git -C backup-store --work-tree="$RUNNER_TEMP/snapshot" add -A
          TREE="$(git -C backup-store write-tree)"
          COMMIT="$(printf 'Encrypted D1 backup %s\n' "$(TZ=Asia/Shanghai date +%F)" | git -C backup-store commit-tree "$TREE")"
          if test -n "$EXPECTED_SHA"; then
            LEASE="--force-with-lease=refs/heads/$BACKUP_BRANCH:$EXPECTED_SHA"
          else
            LEASE="--force-with-lease=refs/heads/$BACKUP_BRANCH:"
          fi
          git -C backup-store push origin "$COMMIT:refs/heads/$BACKUP_BRANCH" "$LEASE"

      - name: Remove plaintext and temporary credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/new-backup" "$RUNNER_TEMP/verification" "$RUNNER_TEMP/wrangler-backup.toml" "$RUNNER_TEMP/d1-preflight.json" "$RUNNER_TEMP/age" "$RUNNER_TEMP/snapshot" "$RUNNER_TEMP/backup-index"
